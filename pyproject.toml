[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dyna"
version = "0.1.0"
description = "Tools for composing and analyzing continuous-time dynamical systems and discrete maps"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "matplotlib",
    "scipy",
    "sympy",
    "jax",
    "diffrax",
]

[tool.setuptools.packages.find]
include = ["dyna*"]
